[build-system]
requires = ["setuptools>=77"]  # license = "MIT" + license-files (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "pyalexaalerts"
dynamic = ["version"]
description = "An unofficial Python library for programmatically managing Amazon Alexa alarms, timers, and reminders."
readme = "README.md"
authors = [{ name = "Kyron Longwood" }]
keywords = ["alexa", "amazon", "echo", "alarm", "reminder", "timer", "cli"]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "requests",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Topic :: Internet :: WWW/HTTP",
]

[project.urls]
Homepage = "https://github.com/kyrlon/pyalexaalerts"
Repository = "https://github.com/kyrlon/pyalexaalerts"
Issues = "https://github.com/kyrlon/pyalexaalerts/issues"

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
pyalexaalerts = "pyalexaalerts.cli:main"
pyalexaalerts-get-cookies = "pyalexaalerts.get_alexa_cookies:cli"
pyalexaalerts-setup-cli = "pyalexaalerts.setup_alexa_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "pyalexaalerts.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
